<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/gallery.css" />
  </head>
  <body class="gallery-page">
    <header class="topbar">
      <a class="brand" href="/" title="Back to the Studio">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M10 8.5v7l5.5-3.5z" /></svg>
        <span>Anim Studio</span>
      </a>
      <nav class="segmented" aria-label="Pages">
        <a href="/">Studio</a>
        <a href="/gallery" class="on" aria-current="page">Gallery</a>
      </nav>
      <div class="topbar-actions">
        <button id="theme" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>
        </button>
      </div>
    </header>

    <div class="gallery">
      <aside class="g-nav" aria-label="Sections">
        <div class="g-controls">
          <label class="setting">
            <span>Look</span>
            <select id="g-look"></select>
          </label>
          <label class="setting" title="How many items the template examples hold">
            <span>Template items</span>
            <select id="g-density">
              <option value="typical">Typical</option>
              <option value="min">Fewest allowed</option>
              <option value="max">Most allowed</option>
            </select>
          </label>
          <label class="setting">
            <span>Filter</span>
            <input id="g-filter" type="search" placeholder="steps, L3, chart…" />
          </label>
        </div>
        <nav id="g-toc"></nav>
      </aside>

      <main class="g-main">
        <div class="g-head">
          <h1>Layout gallery</h1>
          <p id="g-summary" class="hint"></p>
        </div>
        <div id="g-groups"></div>
      </main>
    </div>

    <script type="module" src="./src/gallery.ts"></script>
  </body>
</html>
